# Раздача статического экспорта Next.js (каталог out/) на VPS.
# Node-процесс не нужен: сайт без бэкенда, заявки уходят в WhatsApp.
#
# Деплой:
#   npm run build
#   rsync -az --delete out/ user@server:/var/www/weldingcompany/
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/weldingcompany
#   sudo ln -s /etc/nginx/sites-available/weldingcompany /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name weldingcompany.kz www.weldingcompany.kz;

    # Сертификат выпускается через certbot:
    #   sudo certbot --nginx -d weldingcompany.kz -d www.weldingcompany.kz
    # После выпуска certbot сам добавит блок listen 443 ssl и редирект с 80.

    root /var/www/weldingcompany;
    index index.html;

    charset utf-8;

    # --- Сжатие -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Brotli — если собран модуль ngx_brotli, иначе строки ниже убрать.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Безопасность -----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Локали -----------------------------------------------------------
    # Middleware в статическом экспорте не работает, поэтому корень
    # перенаправляет nginx. Русский — язык по умолчанию.
    location = / {
        return 302 /ru/;
    }

    # --- Кэширование ------------------------------------------------------
    # Файлы в /_next/static/ содержат хеш в имени — кэшируем навсегда.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Основная выдача --------------------------------------------------
    # trailingSlash: true, поэтому /ru/services/ -> /ru/services/index.html.
    # $uri/ обрабатывает случай без завершающего слэша.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
